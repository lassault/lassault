[tools]
python = "3.15.1"

[tasks.install]
description = "Install dependencies"
run = "pip install fonttools brotli pyyaml"

[tasks.build]
description = "Build the SVG files"
run = "python3 build.py"

[tasks.test]
description = "Run build and configuration tests"
run = "python3 -m unittest discover -s tests -v"

[tasks.check]
description = "Check generated asset structure"
run = "python3 scripts/check_generated.py"

[tasks.preview]
description = "Serve the generated profile locally"
run = "python3 -m http.server 8000"
