name: Build profile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: mise run install
      - run: mise run build
      - run: mise run test
      - run: mise run check
